name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-tag-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ensure tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

  build:
    needs: verify-tag-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Verify binary version (unix)
        if: runner.os != 'Windows'
        run: |
          EXPECTED="mmdr ${GITHUB_REF_NAME#v}"
          ACTUAL="$(target/${{ matrix.target }}/release/mmdr --version)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
      - name: Verify binary version (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "mmdr $($env:GITHUB_REF_NAME.Substring(1))"
          $actual = (target\${{ matrix.target }}\release\mmdr.exe --version).Trim()
          if ($actual -ne $expected) {
            Write-Host "Expected '$expected' but got '$actual'"
            exit 1
          }
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mmdr${{ matrix.ext }} dist/
          tar -czf mmdr-${{ matrix.target }}.tar.gz -C dist .
          sha256sum mmdr-${{ matrix.target }}.tar.gz > mmdr-${{ matrix.target }}.tar.gz.sha256
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\\${{ matrix.target }}\\release\\mmdr.exe dist\\
          Compress-Archive -Path dist\\mmdr.exe -DestinationPath mmdr-${{ matrix.target }}.zip
          (Get-FileHash mmdr-${{ matrix.target }}.zip -Algorithm SHA256).Hash + "  mmdr-${{ matrix.target }}.zip" | Out-File -Encoding ASCII mmdr-${{ matrix.target }}.zip.sha256
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            mmdr-${{ matrix.target }}.tar.gz
            mmdr-${{ matrix.target }}.tar.gz.sha256
            mmdr-${{ matrix.target }}.zip
            mmdr-${{ matrix.target }}.zip.sha256

